<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e9d3f">
<title>ETA Pharmacy | صيدليتك أونلاين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2e9d3f;--gd:#0d4a26;--gs:#e8f6ea;--bg:#fff;--card:#fff;--ink:#14231a;--mute:#6b7f72;--line:#e3eee6;--sh:0 6px 22px rgba(20,90,40,.1);--warn:#b45309;--warnbg:#fdf0d8;color-scheme:light}
:root[data-theme=dark]{--g:#4ade80;--gd:#bbf7d0;--gs:#16301f;--bg:#0e1a13;--card:#15251b;--ink:#eaf5ec;--mute:#93ad9a;--line:rgba(255,255,255,.1);--sh:0 6px 22px rgba(0,0,0,.5);--warn:#f5b350;--warnbg:#3a2a10;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,var(--gs),var(--bg) 280px) no-repeat var(--bg);color:var(--ink);font:400 15px/1.6 Tajawal,Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 104px;max-width:760px;margin:auto;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.tb{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;color:var(--g);text-decoration:none}
.logo span{width:34px;height:34px;border-radius:11px;background:var(--g);color:#fff;display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.loc{display:flex;align-items:center;gap:6px;border:1.5px solid var(--g);border-radius:16px;padding:7px 12px;font-weight:700;font-size:14px;max-width:150px}
.loc svg,.ib svg,.tabs svg,.sr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.loc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:42px;height:42px;display:grid;place-items:center;color:var(--g);border-radius:14px}
.ib i{position:absolute;top:0;inset-inline-start:0;min-width:18px;height:18px;border-radius:9px;background:var(--g);color:#fff;font:800 11px/18px Tajawal;text-align:center;font-style:normal}
.ib i[data-n="0"]{display:none}
.sr{display:flex;align-items:center;gap:8px;margin:8px 14px;background:var(--card);border-radius:18px;box-shadow:var(--sh);height:48px;padding:0 8px 0 14px;border:1px solid var(--line)}
.sr input{flex:1;min-width:0;border:0;background:none;outline:0;height:100%}
.sr svg{color:var(--mute)}
.sr .ib{width:36px;height:36px}
.stories{display:flex;gap:12px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.stv{flex:none;width:76px;text-align:center}
.ring{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;border:2.5px solid var(--g);padding:3px;margin:auto}
.ring .in{display:grid;place-items:center;width:100%;height:100%;border-radius:50%}
.ring svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.stv small{display:block;font-size:12px;line-height:1.25;margin-top:5px;font-weight:500}
.ban{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 14px 4px;scrollbar-width:none}
.sl{flex:0 0 92%;scroll-snap-align:center;border-radius:24px;padding:20px;min-height:158px;color:#fff;position:relative;overflow:hidden;text-align:start;display:flex;flex-direction:column;justify-content:center;gap:6px}
.sl h3{font-size:22px;font-weight:800;line-height:1.25;max-width:70%}
.sl p{opacity:.9;font-size:13.5px;max-width:70%}
.sl b{align-self:flex-start;background:#fff;color:var(--gd);border-radius:12px;padding:7px 16px;font-size:13px;margin-top:6px}
.sl svg{position:absolute;inset-inline-end:-10px;bottom:-14px;width:150px;height:150px;fill:none;stroke:#fff;stroke-width:1;opacity:.25;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;justify-content:center;gap:5px;margin:8px 0}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:.3s}
.dots i.on{width:20px;background:var(--g)}
.sh{display:flex;justify-content:space-between;align-items:baseline;padding:0 14px;margin:20px 0 10px}
.sh b{font-size:19px;font-weight:800}
.sh a{color:var(--mute);font-size:13px}
.brs{display:flex;gap:12px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none}
.br{flex:none;width:112px;height:80px;border-radius:20px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:15px;direction:ltr;padding:0 8px;text-align:center}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px}
.dt{background:var(--card);border-radius:20px;box-shadow:var(--sh);border:1px solid var(--line);padding:6px 6px 10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.dt .th{border-radius:16px;aspect-ratio:1/.9}
.dt b{font-size:13px;line-height:1.25;font-weight:700}
.dt small{color:var(--mute);font-size:11px}
.hs{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none}
.hs .card{flex:none;width:156px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px}
.card{position:relative;display:flex;flex-direction:column;gap:3px;background:var(--card);border-radius:22px;box-shadow:var(--sh);border:1px solid var(--line);padding:7px 7px 10px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:270px}
.th{position:relative;overflow:hidden;display:grid;place-items:center;border-radius:18px}
.th.big{aspect-ratio:1/.86}
.th.xl{aspect-ratio:1/.8;border-radius:24px}
.th svg{width:44%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.th svg.pk,.th.xl svg.pk{width:auto;max-width:92%;height:92%;stroke:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.card h3{font-size:13.5px;font-weight:700;line-height:1.35;margin:4px 4px 0;min-height:36px}
.card small{margin:0 4px;color:var(--mute);font-size:11px;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{display:flex;gap:4px;flex-wrap:wrap;min-height:20px;margin:0 4px}
.tg em{font-style:normal;font-size:11px;padding:1px 9px;border-radius:99px;background:var(--gs);color:var(--g);font-weight:500}
.tg em.rx{background:var(--warnbg);color:var(--warn);font-weight:700}
.pr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px 4px 0}
.pr b{font-size:15px;font-weight:800;color:var(--gd)}
.add{background:var(--g);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:12px}
.stp{display:inline-flex;align-items:center;background:var(--gs);border-radius:12px}
.stp button{width:32px;height:32px;font-size:19px;font-weight:700;color:var(--g)}
.stp b{min-width:20px;text-align:center;font-size:14px}
.fv{position:absolute;top:12px;inset-inline-end:12px;z-index:2;width:32px;height:32px;border-radius:50%;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center;color:var(--g)}
.fv svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
.fv.on svg{fill:#e11d48;stroke:#e11d48}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--g);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:16px;width:100%}
.btn.o{background:none;border:1.5px solid var(--g);color:var(--g)}
.empty{grid-column:1/-1;text-align:center;padding:50px 14px;color:var(--mute)}
.lh{display:flex;align-items:center;gap:6px;padding:8px 14px 0}
.lh h2{flex:1;font-size:19px;font-weight:800}
.tools{display:flex;gap:10px;align-items:center;padding:8px 14px;font-size:13px;color:var(--mute)}
.tools select{margin-inline-start:auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 8px}
.otc{display:flex;gap:6px;align-items:center}
.tabs{position:fixed;z-index:30;bottom:0;inset-inline:0;max-width:760px;margin:auto;display:flex;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.1);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:18px;font-size:11.5px;font-weight:500;color:var(--mute)}
.tabs button.on{background:var(--gs);color:var(--g);font-weight:700}
.pg{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;max-width:760px;margin:auto;padding-bottom:110px}
.pgh{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pgh b{flex:1;font-size:17px}
.pb{padding:12px 14px}
.pimg{position:relative;border:1px solid var(--line);border-radius:26px;padding:8px;background:var(--card)}
.pact{position:absolute;bottom:14px;inset-inline-end:14px;display:grid;gap:8px}
.pact .ib{background:var(--card);box-shadow:0 3px 12px rgba(0,0,0,.15);border-radius:50%}
.pb h1{font-size:20px;font-weight:800;margin:12px 0 2px;line-height:1.35}
.en{direction:ltr;text-align:start;color:var(--mute)}
.price{font-size:26px;font-weight:800;color:var(--gd);margin:8px 0}
.sec{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.sec h4{font-size:16px;margin-bottom:4px}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:16px;padding:10px 12px;font-size:13px;margin:10px 0}
.pbar{position:fixed;bottom:0;inset-inline:0;max-width:760px;margin:auto;z-index:62;background:var(--card);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.1);display:flex;gap:10px;align-items:center}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li .th{width:56px;height:56px;flex:none;border-radius:14px}
.li .th svg{width:60%}
.li div{flex:1;min-width:0}
.li b{font-size:14px;display:block;line-height:1.3}
.li small{color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin:12px 0;box-shadow:var(--sh)}
.row2{display:flex;justify-content:space-between;padding:4px 0}
.row2.tot{font-size:18px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.bar2{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}
.bar2 i{display:block;height:100%;background:var(--g);transition:width .4s}
.f{display:grid;gap:8px;margin:12px 0}
.f input,.f textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.f textarea{min-height:60px;resize:vertical}
.up{display:inline-flex;margin-top:8px;padding:7px 14px;border-radius:99px;border:1.5px dashed var(--warn);cursor:pointer;font-weight:700}
.oc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:10px 14px;box-shadow:var(--sh)}
.oc small{color:var(--mute)}
.mod{position:fixed;z-index:80;inset:auto 0 0 0;max-width:760px;margin:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mod.on{transform:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:90;opacity:0;pointer-events:none;transition:.3s;font-size:14px;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.dgrid{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
.logo svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.logo em{font-style:normal;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logo span{overflow:hidden}
.sr .ib{width:34px;height:34px}.sr .ib svg{stroke-width:1.6}
details.box summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}details.box summary::after{content:"‹";transform:rotate(-90deg);font-size:22px;color:var(--mute)}details[open].box summary::after{transform:rotate(90deg)}
.lgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.lgb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--g);font-size:11px}.lgb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.lgb span{color:var(--ink)}.lgb.on{border-color:var(--g);box-shadow:0 0 0 2px var(--g)}
.sws{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.swc{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}.swc.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.f select{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
</style>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('eta-theme'))||'light'}catch(e){}</script>
</head>
<body>
<header class="tb">
  <button class="ib" id="cartB" aria-label="السلة"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 11h11L21 7H6"/></svg><i id="cartN" data-n="0"></i></button>
  <a class="logo" href="#home"><span id="lgm"></span><em id="lgn">ETA</em></a>
  <button class="loc" id="locB"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="locT">حدد موقعك</span></button>
</header>
<label class="sr"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="ابحث عن دواء أو منتج…" autocomplete="off" enterkeyhint="search" aria-label="بحث"><button class="ib" id="bcB" type="button" aria-label="بحث بالباركود"><svg viewBox="0 0 24 24"><path d="M4 6v12M8 6v12M12 6v12M16 6v12M20 6v12"/></svg></button><button class="ib" id="imB" type="button" aria-label="بحث بالصورة"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></button><button class="ib" id="mic" type="button" aria-label="بحث صوتي"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button></label>
<section id="v-home"></section><section id="v-list" hidden></section><section id="v-cats" hidden></section><section id="v-orders" hidden></section><section id="v-fav" hidden></section><section id="v-acc" hidden></section>
<nav class="tabs" aria-label="التنقل">
  <button data-t="home" data-go="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>الرئيسية</button>
  <button data-t="cats" data-go="cats"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>التصنيفات</button>
  <button data-t="orders" data-go="orders"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V4h6v3M4 12h16"/></svg>طلباتي</button>
  <button data-t="fav" data-go="fav"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-8.5-9A4.5 4.5 0 0112 6.5 4.5 4.5 0 0120.5 11C19 15.5 12 20 12 20z"/></svg>المفضلة</button>
  <button data-t="acc" data-go="acc"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-8 8-8s8 3 8 8"/></svg>الحساب</button>
</nav>
<section class="pg" id="pp" hidden></section>
<section class="pg" id="cp" hidden></section>
<div class="ov" id="ov"></div>
<section class="mod" id="loc" role="dialog" aria-label="تحديد الموقع"></section>
<div class="toast" id="toast" role="status"></div>
<script>
let WA='',DELIVERY=30,FREE_OVER=500;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:2}).format(n)+' ج.م';
const CATS=['أدوية','مستحضرات تجميل','كريمات الشعر','مراهم حبوب الوجه','العظام','مكياج'];
const CC={'أدوية':['#0f766e','#d6f0ea'],'مستحضرات تجميل':['#be185d','#fbe0ee'],'كريمات الشعر':['#b45309','#fdebc2'],'مراهم حبوب الوجه':['#c2410c','#fddcc8'],'العظام':['#1d4ed8','#d8e4fd'],'مكياج':['#a21caf','#f6d9fb']};
const IC={};
function norm(s){return String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632})}
function kind(m){var n=norm(m.n+' '+(m.en||'')),c=m.cat||'أدوية';
  if(c==='مكياج'){
    if(/روج|lipstick|gloss|شفاه|تينت|tint|\blip\b/.test(n))return 'lipstick';
    if(/ماسكارا|mascara|ايلاينر|liner|كحل|kohl|kajal|حواجب|brow|رموش|lash|غراء|waterline/.test(n))return 'eye';
    if(/فرشاه|فرش|brush|اسفنجه|sponge/.test(n))return 'brush';
    if(/اظافر|nail|polish|طلاء/.test(n))return 'nail';
    if(/ظلال|shadow|palette|باليت|كونتور|contour/.test(n))return 'palette';
    if(/مراه|mirror|بودره|powder|بلاشر|blush|هايلايتر|highlighter|برونزر|bronzer|كوشن|cushion/.test(n))return 'compact';
    return 'pump'}
  if(/ميزان حراره|thermometer/.test(n))return 'thermo';
  if(/شرائط|strips|جهاز سكر|glucometer/.test(n))return 'strip';
  if(/جهاز ضغط|blood pressure|نيبولايزر|nebulizer/.test(n))return 'compact';
  if(/كمامه|face mask|قفازات|gloves/.test(n))return 'mask';
  if(/بلاستر|plaster|لصقات|heat patch/.test(n))return 'plaster';
  if(/دعامه|حزام|مثبت رسغ|brace|support|رباط|bandage/.test(n))return 'brace';
  if(/تحاميل|supp/.test(n))return 'supp';
  if(/حقن|inj|انسولين|insulin|لانتوس|ميكستارد|novorapid|levemir|victoza|clexane|كلكسان|syringe/.test(n))return 'syr';
  if(/شراب|syrup/.test(n))return 'bottle';
  if(/قطره|drops/.test(n))return 'dropper';
  if(/بخاخ|spray|symbicort|seretide|spiriva|becotide|flovent|ventolin|pulmicort|atrovent/.test(n))return 'spray';
  if(/محلول|مطهر|betadine|dettol|كحول|alcohol|ميسلار|micellar|حليب|formula|لوشن|lotion|baby oil|زيت اطفال/.test(n))return 'bottle';
  if(/كريم|cream/.test(n)&&c!=='أدوية'&&!/جل/.test(n))return 'jar';

  if(a==='chpw'){const o=await ask('كلمة المرور الحالية',[['password','الحالية']]);if(!o||!await chkPw(o[0]))return toast('كلمة المرور الحالية غلط');const w=await ask('كلمة مرور جديدة',[['password','8 أحرف على الأقل'],['password','أعد كتابتها']]);if(!w||w[0].length<8||w[0]!==w[1])return toast('غير متطابقة');await setPw(w[0]);return toast('تم تغيير كلمة المرور')}
  if(a==='sqsave'){const x=nrm(v('#sa'));if(x.length<2)return toast('اكتب الإجابة');const s=hexs(crypto.getRandomValues(new Uint8Array(16)));SEC={...SEC,q:$('#sq').value,qs:s,qa:await kd(x,s)};ls.set('eta-sec',SEC);toast('تم حفظ السؤال السري');return drawAcc()}
  if(a==='bioon'){if(!navigator.credentials||!window.PublicKeyCredential)return toast('المتصفح مش بيدعم البصمة');try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:CFG.name},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'owner',displayName:'Owner'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},attestation:'none',timeout:60000}});localStorage.setItem('eta-bio',JSON.stringify([...new Uint8Array(c.rawId)]));toast('تم تفعيل البصمة أو الوجه');drawAcc()}catch(err){toast(err&&err.name==='SecurityError'?'افتح المتجر من https في Chrome':'لم يتم التفعيل. فعّل بصمة أو قفل شاشة في الموبايل')}return}
  if(a==='biotest')return toast(await bioAuth()?'البصمة شغالة':'فشل التحقق');
  if(a==='biooff'){try{localStorage.removeItem('eta-bio')}catch(e){}return drawAcc()}
  if(a==='expcfg'){dl('config.json',pubCfg());return toast('انرفع ملف config.json على GitHub جنب store.html')}
  if(a==='expall')return dl('eta-backup.json',{cfg:CFG,ppl});if(a==='impall')return imp.click();if(a==='scanfind')return scanBC(findBC);
  if(a==='ep'){const x=await ask('السعر الجديد',[['number','السعر بالجنيه']]);if(!x||x[0]==='')return;CFG.ov[k]={...CFG.ov[k],p:+x[0]};saveCfg();return prod(+k)}
  if(a==='eb'){const x=await ask('الباركود',[['text','اكتب الرقم أو اتركه فاضي للمسح بالكاميرا']]);if(!x)return;const set=c=>{CFG.ov[k]={...CFG.ov[k],bc:c};saveCfg();prod(+k)};x[0].trim()?set(x[0].trim()):scanBC(set);return}
  if(a==='eh'){CFG.ov[k]={...CFG.ov[k],hide:!(CFG.ov[k]||{}).hide};saveCfg();return prod(+k)}});
$('#occ')&&0;
document.addEventListener('input',e=>{if(e.target.id==='occ'&&S.own){CFG.c=e.target.value;saveCfg()}});

  const loc=ls.get('eta-cfg',{});CFG={...CFG,...rem,...loc,ov:{...(rem.ov||{}),...(loc.ov||{})}};if(!Array.isArray(CFG.docs))CFG.docs=CFG.doc?[CFG.doc]:['Dr. Eslam Tarek Eldabea'];
  applyCfg();buildDep();addEventListener('hashchange',route);locT();badge();route()}
